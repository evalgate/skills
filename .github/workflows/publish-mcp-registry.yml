name: Publish MCP Registry

on:
  pull_request:
    paths:
      - server.json
      - .github/workflows/publish-mcp-registry.yml
  push:
    branches: [main]
    paths:
      - server.json
  workflow_dispatch:

permissions:
  contents: read

env:
  MCP_PUBLISHER_VERSION: "1.8.1"
  MCP_PUBLISHER_SHA256: a06c9096dcb9727c13555b6be26c7effa707b01f06a4c561ba7a3635443cf2cc

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out metadata and Skills distribution
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 24
      - name: Validate the Skills distribution
        run: npm test
      - name: Install verified MCP publisher
        shell: bash
        run: |
          set -euo pipefail
          publisher_dir="${RUNNER_TEMP}/evalgate-mcp-publisher"
          mkdir -p "$publisher_dir"
          curl --fail --silent --show-error --location \
            --output "$publisher_dir/mcp-publisher.tar.gz" \
            "https://github.com/modelcontextprotocol/registry/releases/download/v${MCP_PUBLISHER_VERSION}/mcp-publisher_linux_amd64.tar.gz"
          printf '%s  %s\n' "$MCP_PUBLISHER_SHA256" "$publisher_dir/mcp-publisher.tar.gz" | sha256sum --check -
          tar -xzf "$publisher_dir/mcp-publisher.tar.gz" -C "$publisher_dir" mcp-publisher
          printf '%s\n' "$publisher_dir" >> "$GITHUB_PATH"
      - name: Validate registry metadata
        run: mcp-publisher validate server.json

  publish:
    needs: validate
    if: >-
      github.repository == 'evalgate/skills' &&
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    concurrency:
      group: evalgate-mcp-registry-publication
      cancel-in-progress: false
    steps:
      - name: Check out reviewed metadata
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - name: Install verified MCP publisher
        shell: bash
        run: |
          set -euo pipefail
          publisher_dir="${RUNNER_TEMP}/evalgate-mcp-publisher"
          mkdir -p "$publisher_dir"
          curl --fail --silent --show-error --location \
            --output "$publisher_dir/mcp-publisher.tar.gz" \
            "https://github.com/modelcontextprotocol/registry/releases/download/v${MCP_PUBLISHER_VERSION}/mcp-publisher_linux_amd64.tar.gz"
          printf '%s  %s\n' "$MCP_PUBLISHER_SHA256" "$publisher_dir/mcp-publisher.tar.gz" | sha256sum --check -
          tar -xzf "$publisher_dir/mcp-publisher.tar.gz" -C "$publisher_dir" mcp-publisher
          printf '%s\n' "$publisher_dir" >> "$GITHUB_PATH"
      - name: Authenticate to the MCP Registry
        run: mcp-publisher login github-oidc
      - name: Publish a new metadata version
        run: mcp-publisher publish server.json
